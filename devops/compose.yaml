services:
  catalog-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_catalog}
      POSTGRES_USER: ${DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_local_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  catalog-postgres-data:
