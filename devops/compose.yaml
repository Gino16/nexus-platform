services:
  catalog-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_catalog}
      POSTGRES_USER: ${DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_local_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  inventory-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-nexus_inventory}
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-nexus_inventory_local_only}
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-nexus_order}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-nexus_order_local_only}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-nexus_payment}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-nexus}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-nexus_payment_local_only}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5435}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  catalog-postgres-data:
  inventory-postgres-data:
  order-postgres-data:
  kafka-data:
  payment-postgres-data:
