openapi: 3.0.3
info:
  title: NEXUS Catalog API
  version: 1.0.0
  description: Contract for creating, retrieving, and listing active catalog products.
servers:
  - url: /api/v1
    description: NEXUS API v1
tags:
  - name: Products
    description: Product catalog operations
paths:
  /products:
    post:
      tags:
        - Products
      operationId: createProduct
      summary: Create a product
      description: Creates a product in active status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Products
      operationId: listActiveProducts
      summary: List active products
      parameters:
        - name: page
          in: query
          description: Zero-based page index.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 1000000
        - name: size
          in: query
          description: Maximum number of products returned per page.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: name
          in: query
          description: Case-insensitive substring of the product name.
          schema:
            type: string
            maxLength: 100
        - name: minPrice
          in: query
          description: Inclusive minimum price in PEN.
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          description: Inclusive maximum price in PEN.
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Page of active products ordered by name and ID
          headers:
            X-Has-Next:
              description: Whether another page of matching products exists
              schema:
                type: boolean
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid pagination parameters or price range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{productId}:
    get:
      tags:
        - Products
      operationId: getProductById
      summary: Retrieve an active product
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: No active product was found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Update a product
      description: Updates the name, description, price, and active status of an existing product.
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No product was found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateProductRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - price
      properties:
        name:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
          description: Product name; must contain a non-whitespace character.
        description:
          type: string
          description: Product description.
        price:
          type: number
          minimum: 0
          maximum: 99999999999999999.99
          multipleOf: 0.01
          description: Product price in PEN, with two decimal places.
    ProductResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - price
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Product price in PEN, with two decimal places.
        active:
          type: boolean
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - price
        - active
      properties:
        name:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
          description: Product name; must contain a non-whitespace character.
        description:
          type: string
          description: Product description.
        price:
          type: number
          minimum: 0
          maximum: 99999999999999999.99
          multipleOf: 0.01
          description: Product price in PEN, with two decimal places.
        active:
          type: boolean
          description: Whether the product is visible in public catalog reads.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code for clients.
        message:
          type: string
          description: Human-readable error detail.
        details:
          type: array
          description: Individual client-facing errors associated with the request.
          items:
            type: string
