openapi: 3.0.3
info:
  title: NEXUS Orders
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Orders
paths:
  /orders/{orderId}:
    put:
      tags: [Orders]
      operationId: submitOrder
      summary: Submit a purchase order with a client-generated ID for retries
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
      responses:
        '202':
          description: Order accepted for processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {description: Invalid order or inactive product}
        '409': {description: Order ID already used for a different request}
        '503': {description: Catalog temporarily unavailable}
    get:
      tags: [Orders]
      operationId: getOrder
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '404': {description: Order not found}
components:
  schemas:
    OrderRequest:
      type: object
      required: [customerId, paymentOutcome, lines]
      properties:
        customerId: {type: string, format: uuid}
        paymentOutcome: {type: string, enum: [APPROVED, DECLINED]}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/OrderLineRequest'}
    OrderLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
    OrderLineResponse:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: integer}
        unitPrice: {type: number}
    OrderResponse:
      type: object
      required: [orderId, customerId, status, total, createdAt, lines]
      properties:
        orderId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, PROCESSING, CONFIRMED, REJECTED]}
        total: {type: number}
        createdAt: {type: string, format: date-time}
        rejectionReason: {type: string}
        lines:
          type: array
          items: {$ref: '#/components/schemas/OrderLineResponse'}
